[project]
name = "morning-companion"
version = "0.1.0"
description = "Daily AI Telegram companion"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.22.0",
    "sqlalchemy>=2.0",
    "aiosqlite",
    "apscheduler",
    "aiohttp",
    "python-dotenv",
    "pydantic>=2",
    "pydantic-settings",
    "aiohttp-socks>=0.11.0",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
